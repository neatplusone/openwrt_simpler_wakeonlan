# .github/workflows/deploy.yml
name: deploy
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy'
        required: true
        default: 'v1.0.0'
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set env
      run: echo "GIT_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and release on GitHub Container Registry
      uses: docker/build-push-action@v6
      with:
        file: support/build.Dockerfile
        push: true
        platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
        tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ env.GIT_TAG }}
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    - name: Install required tools
      run: |
        echo "Installing/verifying required tools..."

        # For Linux (Ubuntu runner)
        if [[ "$OSTYPE" == "linux-gnu"* ]]; then
          if ! command -v sha256sum &> /dev/null; then
            echo "sha256sum not found, installing coreutils on Linux..."
            sudo apt-get update
            sudo apt-get install -y coreutils
          else
            echo "sha256sum already installed"
          fi
        fi

        # For macOS
        if [[ "$OSTYPE" == "darwin"* ]]; then
          if ! command -v shasum &> /dev/null; then
            echo "shasum not found, installing coreutils on macOS..."
            brew install coreutils
          else
            echo "shasum already installed"
          fi
        fi
    - name: Build all artifacts
      run: make build-all
    - name: "Release gh release versioned"
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ env.GIT_TAG }}
        allowUpdates: true
        artifacts: "builds/*"
        bodyFile: "builds/buildout"
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: "Release gh release latest"
      uses: ncipollo/release-action@v1
      with:
        tag: latest
        name: Latest
        allowUpdates: true
        artifacts: "builds/*"
        bodyFile: "builds/buildout"
        token: ${{ secrets.GITHUB_TOKEN }}